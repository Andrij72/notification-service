name: Build & Test Notification Service

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/notification-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & run tests
        run: |
          chmod +x ./mvnw
          ./mvnw clean test -Dspring.profiles.active=docker

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push Docker image (latest)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}

  docker-release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push Docker image (tagged release)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
            ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.7.1
        ports:
          - 2181:2181
        options: >-
          --health-cmd="echo ruok | nc localhost 2181 | grep imok"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

      broker:
        image: confluentinc/cp-kafka:7.7.1
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: localhost:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd="kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12

      schema-registry:
        image: confluentinc/cp-schema-registry:7.7.1
        ports:
          - 8081:8081
        env:
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://localhost:9092
          SCHEMA_REGISTRY_HOST_NAME: localhost
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
        options: >-
          --health-cmd="curl -f http://localhost:8081/subjects || exit 1"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12

    steps:
      - uses: actions/checkout@v3

      - name: Wait for Kafka services to be healthy
        run: |
          echo "Waiting for Zookeeper..."
          until docker inspect --format='{{.State.Health.Status}}' ${{ job.services.zookeeper.id }} | grep healthy; do sleep 2; done
          echo "Zookeeper is ready."

          echo "Waiting for Kafka broker..."
          until docker inspect --format='{{.State.Health.Status}}' ${{ job.services.broker.id }} | grep healthy; do sleep 2; done
          echo "Kafka broker is ready."

          echo "Waiting for Schema Registry..."
          until docker inspect --format='{{.State.Health.Status}}' ${{ job.services.schema-registry.id }} | grep healthy; do sleep 2; done
          echo "Schema Registry is ready."

      - name: Run API tests
        run: |
          curl -v http://localhost:8089/actuator/health || exit 1
