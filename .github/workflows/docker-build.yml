name: Build & Test Notification Service

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/notification-service

jobs:
  # ---------------------------
  # Unit & Integration Tests
  # ---------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run unit + integration tests
        run: mvn clean verify

      - name: Build jar (skip tests)
        run: mvn clean package -DskipTests

  # ---------------------------
  # Docker Build & Push (Develop)
  # ---------------------------
  docker-develop:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build & Push Docker image (dev)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:dev-latest
            ${{ env.DOCKER_IMAGE }}:dev-${{ env.SHORT_SHA }}

  # ---------------------------
  # Docker Build & Push (Main)
  # ---------------------------
  docker-main:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build & Push Docker image (latest)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}

  # ---------------------------
  # Docker Build & Push (Release)
  # ---------------------------
  docker-release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build & Push Docker image (tagged release)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
            ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}

  # ---------------------------
  # E2E Tests
  # ---------------------------
  e2e-tests:
    runs-on: ubuntu-latest
    needs: docker-develop
    steps:
      - name: Pull Notification Service image
        run: docker pull ${{ env.DOCKER_IMAGE }}:dev-latest

      - name: Start Zookeeper
        run: |
          docker run -d --rm --name zookeeper -p 2181:2181 \
            confluentinc/cp-zookeeper:7.5.0
          echo "Waiting for Zookeeper..."
          sleep 15

      - name: Start Kafka
        run: |
          docker run -d --rm --name kafka -p 9092:9092 \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            --network host \
            confluentinc/cp-kafka:7.5.0
          echo "Waiting for Kafka..."
          sleep 25

      - name: Start Schema Registry
        run: |
          docker run -d --rm --name schema-registry -p 8081:8081 \
            -e SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://localhost:9092 \
            -e SCHEMA_REGISTRY_HOST_NAME=localhost \
            -e SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081 \
            confluentinc/cp-schema-registry:7.5.0
          echo "Waiting for Schema Registry..."
          sleep 20

      - name: Run Notification Service container
        run: |
          docker run -d --name notification-service \
            -p 8089:8089 \
            -e SPRING_PROFILES_ACTIVE=docker \
            ${{ env.DOCKER_IMAGE }}:dev-latest
          echo "Waiting for Notification Service..."
          sleep 20

      - name: Run API tests
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8089/actuator/health && break
            echo "Waiting for Notification Service..."
            sleep 5
          done

      - name: Cleanup containers
        if: always()
        run: |
          docker stop notification-service schema-registry kafka zookeeper || true
          docker rm notification-service schema-registry kafka zookeeper || true
