name: Build & Test Notification Service

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/notification-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & run tests
        run: |
          chmod +x ./mvnw
          ./mvnw clean test -Dspring.profiles.active=docker

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push Docker image (latest)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}

  docker-release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push Docker image (tagged release)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
            ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Start Zookeeper
        run: |
          docker run -d --rm --name zookeeper -p 2181:2181 \
            confluentinc/cp-zookeeper:7.7.1 /etc/confluent/docker/run
          echo "Waiting for Zookeeper to be ready..."
          sleep 15

      - name: Start Kafka broker
        run: |
          docker run -d --rm --name kafka -p 9092:9092 \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=host.docker.internal:2181 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            confluentinc/cp-kafka:7.7.1
          echo "Waiting for Kafka to be ready..."
          sleep 25

      - name: Start Schema Registry
        run: |
          docker run -d --rm --name schema-registry -p 8081:8081 \
            -e SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://host.docker.internal:9092 \
            -e SCHEMA_REGISTRY_HOST_NAME=localhost \
            -e SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081 \
            confluentinc/cp-schema-registry:7.7.1
          echo "Waiting for Schema Registry to be ready..."
          sleep 20

      - name: Run API tests
        run: |
          curl -v http://localhost:8089/actuator/health || exit 1

      - name: Cleanup containers
        if: always()
        run: |
          echo "Stopping and removing containers..."
          docker ps -a
          docker stop schema-registry kafka zookeeper || true
          docker rm schema-registry kafka zookeeper || true
