services:
  notification-service:
    image: notification-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    restart: always
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true
